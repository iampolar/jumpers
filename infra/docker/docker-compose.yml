# Ambiente de desenvolvimento com os servicos de producao.
#
# NAO e necessario para rodar o projeto: `npm run dev` sobe tudo com
# PostgreSQL embarcado. Use este compose quando precisar de API e worker
# simultaneos, ou para validar o comportamento contra um Postgres gerenciado
# antes do deploy.
#
#   docker compose -f infra/docker/docker-compose.yml up -d
#   export DATABASE_URL=postgres://castwave:castwave@localhost:5432/castwave

name: castwave

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: castwave
      POSTGRES_PASSWORD: castwave
      POSTGRES_DB: castwave
      # Checksum de pagina: detecta corrupcao silenciosa de disco cedo.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U castwave -d castwave']
      interval: 5s
      timeout: 3s
      retries: 10

  # Storage S3-compativel. O driver S3 ainda nao esta implementado; o servico
  # fica aqui pronto para quando estiver.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: castwave
      MINIO_ROOT_PASSWORD: castwave-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
